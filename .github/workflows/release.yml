name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-binaries:
    name: Build Release Binaries
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Docker Compose
      uses: docker/setup-buildx-action@v3

    - name: Run Docker Compose
      run: |
        docker compose up -d
        docker ps

    - name: Build all platform binaries
      run: ./scripts/create-release-binaries.sh

    - name: Create release archives and checksums
      run: ./scripts/create-release-assets.sh

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-assets
        path: release-assets/*
        retention-days: 1

  build-and-scan-container:
    name: Build, Scan, and Push Container Image
    runs-on: ubuntu-latest
    needs: [build-binaries]
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract version info
      id: version
      run: |
        # Handle both tag pushes and workflow_dispatch
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          # For workflow_dispatch, use latest tag or default
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "0.0.0-dev")
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT

        # Check if prerelease
        if [[ "$VERSION" =~ (alpha|beta|rc) ]]; then
          echo "is_prerelease=true" >> $GITHUB_OUTPUT
        else
          echo "is_prerelease=false" >> $GITHUB_OUTPUT
        fi

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha
          type=raw,value=latest,enable=${{ steps.version.outputs.is_prerelease == 'false' }}
        # Custom labels - these will be MERGED with auto-generated ones
        labels: |
          org.opencontainers.image.title=flows2fim
          org.opencontainers.image.description=flows2fim image
          org.opencontainers.image.licenses=Apache v2.0
          maintainer=${{ github.repository_owner }}

    - name: Build Docker image for scanning (without push)
      id: docker_build_scan
      uses: docker/build-push-action@v6
      with:
        context: .
        target: prod
        push: false
        load: true
        platforms: linux/amd64
        cache-from: type=gha
        cache-to: type=gha,mode=max
        tags: local-scan-image:${{ steps.version.outputs.version }}

    - name: Scan container with Trivy
      uses: aquasecurity/trivy-action@v0.36.0
      continue-on-error: true
      with:
        image-ref: local-scan-image:${{ steps.version.outputs.version }}
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
        exit-code: '0'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Build and push multi-platform Docker image
      if: success()
      uses: docker/build-push-action@v6
      with:
        context: .
        target: prod
        push: true
        platforms: linux/amd64,linux/arm64
        provenance: false
        cache-from: type=gha
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries, build-and-scan-container]
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Download release assets
      uses: actions/download-artifact@v4
      with:
        name: release-assets
        path: release-assets

    - name: Generate release notes
      id: release_notes
      run: ./.github/scripts/generate-release-notes.sh "$GITHUB_REF" "${{ github.repository }}" "$GITHUB_OUTPUT"

    - name: Create Draft Release
      uses: softprops/action-gh-release@v2
      with:
        name: ${{ steps.release_notes.outputs.release_title }}
        body_path: release_notes.md
        files: |
          release-assets/flows2fim-darwin-arm64.tar.gz
          release-assets/flows2fim-linux-amd64.tar.gz
          release-assets/flows2fim-linux-arm64.tar.gz
          release-assets/flows2fim-windows-amd64.zip
          release-assets/checksums.txt
        draft: true
        prerelease: ${{ steps.release_notes.outputs.is_prerelease == 'true' }}